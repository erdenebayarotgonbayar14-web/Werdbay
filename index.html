<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Erdenebayar — Photography</title>
<meta name="description" content="Photography portfolio. Documentary, portrait and personal work.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Archivo:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="shell">

  <header class="masthead">
    <h1 class="wordmark" id="wordmark">Erdenebayar</h1>
    <div class="masthead-foot">
      <p class="intro" id="intro"></p>
      <div class="contact-block">
        <div class="contact mono" id="contact"></div>
        <a class="ig-btn" id="igBtn" href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </div>
  </header>

  <main>
    <div class="rule-row mono">
      <span>Albums</span>
      <span id="albumCount"></span>
    </div>
    <ul class="grid" id="grid"></ul>
  </main>

  <footer class="site-foot mono">
    <span id="footName"></span>
    <span id="footYear"></span>
  </footer>

</div>

<script src="data.js"></script>
<script>
(function () {
  // ---- masthead -----------------------------------------------------------
  document.getElementById("wordmark").textContent = SITE.name;
  document.getElementById("intro").textContent = SITE.intro;
  document.title = SITE.name + " — " + SITE.role;

  var bits = [];
  if (SITE.place)   bits.push('<span>' + SITE.place + '</span>');
  if (SITE.email)   bits.push('<span><a href="mailto:' + SITE.email + '">' + SITE.email + '</a></span>');
  if (SITE.phone)   bits.push('<span><a href="tel:' + SITE.phone.replace(/\s/g, "") + '">' + SITE.phone + '</a></span>');
  if (SITE.instagram) bits.push('<span>' + SITE.instagram + '</span>');
  document.getElementById("contact").innerHTML = bits.join("");

  var ig = document.getElementById("igBtn");
  if (SITE.instagramUrl) {
    ig.href = SITE.instagramUrl;
    ig.textContent = SITE.instagramLabel || "Instagram";
  } else {
    ig.remove();
  }

  document.getElementById("footName").textContent = SITE.name;
  document.getElementById("footYear").textContent = "© " + new Date().getFullYear();

  // ---- album grid ---------------------------------------------------------
  var grid = document.getElementById("grid");
  var pad = function (n) { return String(n).padStart(2, "0"); };

  document.getElementById("albumCount").textContent =
    pad(ALBUMS.length) + (ALBUMS.length === 1 ? " album" : " albums");

  if (!ALBUMS.length) {
    grid.innerHTML =
      '<li class="notice"><h1>No albums yet</h1>' +
      '<p>Open <code>data.js</code> and add your first album.</p></li>';
    return;
  }

  ALBUMS.forEach(function (album, i) {
    var count = album.photos ? album.photos.length : 0;
    var li = document.createElement("li");

    li.innerHTML =
      '<a class="card-link" href="album.html?a=' + encodeURIComponent(album.slug) + '">' +
        '<span class="frame protect">' +
          '<img src="' + album.cover + '" alt="Cover photo for ' + album.title + '" loading="lazy" draggable="false">' +
        '</span>' +
        '<span class="card-meta">' +
          '<span class="card-no">' + pad(i + 1) + '</span>' +
          '<span class="card-name">' + album.title + '</span>' +
          '<span class="card-sub">' + (album.year || "") +
            (count ? ' · ' + count + ' photos' : '') + '</span>' +
        '</span>' +
      '</a>';

    var img = li.querySelector("img");
    img.addEventListener("error", function () {
      var box = document.createElement("div");
      box.className = "missing";
      box.textContent = "Add " + album.cover;
      img.replaceWith(box);
    });

    grid.appendChild(li);
  });

  // Зураг хуулбарлахаас сэргийлэх энгийн хамгаалалт
  document.addEventListener("contextmenu", function (e) {
    if (e.target.closest(".protect")) e.preventDefault();
  });
  document.addEventListener("dragstart", function (e) {
    if (e.target.closest(".protect")) e.preventDefault();
  });
})();
</script>
</body>
</html>
