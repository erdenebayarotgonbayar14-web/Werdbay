[build]
  publish = "."
  functions = "netlify/functions"

# Админ хуудсыг хайлтын системд индекслүүлэхгүй
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Зургийг удаан хугацаагаар кэшлэнэ (нэр нь давтагдахгүй тул аюулгүй)
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# data.js-ийг үргэлж шинэчилж татна
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "no-cache"
