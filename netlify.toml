[build]
  publish = "."
  command = ""

# Функцийн хавтас — хоёр түлхүүрийг хоёуланг нь бичив (хувилбар бүрт ажиллана)
[build.environment]
  NODE_VERSION = "18"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# /api/github → функц рүү
[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200
  force = true

# Админ хуудсыг хайлтын системд индекслүүлэхгүй
[[headers]]
  for = "/admin.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Зургийг удаан хугацаагаар кэшлэнэ (нэр давтагдахгүй тул аюулгүй)
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# data.js-ийг үргэлж шинэчилж татна
[[headers]]
  for = "/data.js"
  [headers.values]
    Cache-Control = "no-cache"
